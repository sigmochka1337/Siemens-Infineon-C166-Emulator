<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="560" viewBox="0 0 1420 560" role="img" aria-labelledby="title">
<title id="title">Один Tick: Fetch -&gt; Decode -&gt; Execute -&gt; StepResult</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:DejaVu Sans,sans-serif} .edge{fill:none;stroke:#475569;stroke-width:2.2;} .link{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5} .heading{font-size:29px;font-weight:700;fill:#0f172a} .label{font-size:17px;fill:#334155} .box-title{font-size:21px;font-weight:700;fill:white} .box-body{font-size:16px;fill:white}</style>
<rect width="1420" height="560" fill="#f8fafc"/>
<text class="heading" x="710" y="44" text-anchor="middle">Один Tick: Fetch -&gt; Decode -&gt; Execute -&gt; StepResult</text>
<rect x="30" y="80" width="1360" height="75" rx="10" fill="#e2e8f0"/>
<text class="label" x="710.0" y="109" text-anchor="middle">CpuCore читает PC, вызывает этапы и собирает StepResult.</text>
<text class="label" x="710.0" y="137" text-anchor="middle">Во время исполнения PC изменяет только Executor; отдельного этапа Commit нет.</text>
<rect x="30" y="220" width="240" height="115" rx="12" fill="#1d4ed8"/>
<text class="box-title" x="150.0" y="253" text-anchor="middle">Fetcher · 2</text>
<text class="box-body" x="150.0" y="284" text-anchor="middle">Read16(code), 2/4 bytes</text>
<text class="box-body" x="150.0" y="311" text-anchor="middle">RawInstruction</text>
<rect x="310" y="220" width="240" height="115" rx="12" fill="#1d4ed8"/>
<text class="box-title" x="430.0" y="253" text-anchor="middle">Decoder · 2</text>
<text class="box-body" x="430.0" y="284" text-anchor="middle">чистый Decode(raw)</text>
<text class="box-body" x="430.0" y="311" text-anchor="middle">Instruction</text>
<rect x="590" y="220" width="240" height="115" rx="12" fill="#166534"/>
<text class="box-title" x="710.0" y="253" text-anchor="middle">Executor · 1</text>
<text class="box-body" x="710.0" y="284" text-anchor="middle">операнды · флаги · PC</text>
<text class="box-body" x="710.0" y="311" text-anchor="middle">ExecutionResult</text>
<rect x="870" y="220" width="240" height="115" rx="12" fill="#7e22ce"/>
<text class="box-title" x="990.0" y="253" text-anchor="middle">CpuCore · 4</text>
<text class="box-body" x="990.0" y="284" text-anchor="middle">PC до/после · стадия</text>
<text class="box-body" x="990.0" y="311" text-anchor="middle">StepResult</text>
<rect x="1150" y="220" width="240" height="115" rx="12" fill="#7e22ce"/>
<text class="box-title" x="1270.0" y="253" text-anchor="middle">Debugger · 4</text>
<text class="box-body" x="1270.0" y="284" text-anchor="middle">trace после попытки</text>
<text class="box-body" x="1270.0" y="311" text-anchor="middle">ITraceSink</text>
<path class="edge" d="M270 277 H310"/>
<path class="edge" d="M550 277 H590"/>
<path class="edge" d="M830 277 H870"/>
<path class="edge" d="M1110 277 H1150"/>
<path class="edge" d="M150 335 V395"/>
<path class="edge" d="M710 335 V395"/>
<rect x="30" y="395" width="790" height="110" rx="12" fill="#92400e"/>
<text class="box-title" x="425.0" y="428" text-anchor="middle">Memory · участник 3</text>
<text class="box-body" x="425.0" y="459" text-anchor="middle">Fetcher использует физический IMemoryBus для code.</text>
<text class="box-body" x="425.0" y="486" text-anchor="middle">Executor использует IMachine для регистров, данных и стека.</text>
<rect x="850" y="395" width="540" height="110" rx="10" fill="#e2e8f0"/>
<text class="label" x="1120.0" y="424" text-anchor="middle">Executor обновляет PC, PSW и счётчик EXT.</text>
<text class="label" x="1120.0" y="452" text-anchor="middle">Core не дублирует семантику команды.</text>
<text class="label" x="1120.0" y="480" text-anchor="middle">Debugger получает результат и состояние.</text>
<polygon points="310,277 300,272 300,282" fill="#475569"/>
<polygon points="590,277 580,272 580,282" fill="#475569"/>
<polygon points="870,277 860,272 860,282" fill="#475569"/>
<polygon points="1150,277 1140,272 1140,282" fill="#475569"/>
<polygon points="150,395 145,385 155,385" fill="#475569"/>
<polygon points="710,395 705,385 715,385" fill="#475569"/>
</svg>
